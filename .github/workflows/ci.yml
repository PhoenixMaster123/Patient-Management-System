name: CI

# Pipeline:
#
#   validate ──► backend ──► integration
#
#   frontend ──► pages [main only]
#
# Backend compilation, unit tests and packaging happen once in the same Maven
# reactor build. The frontend checks both its normal build and the standalone
# GitHub Pages/demo build.

on:
  push:
    branches: [main, frontend, deployment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete PR/feature-branch runs.
#
# Main is intentionally excluded because it may contain a Pages deployment.
# Deployments are serialized separately below.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================================
  # BACKEND: STATIC ANALYSIS
  # ============================================================

  validate:
    name: Backend · static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # The root POM already points Checkstyle at the module sources.
      - name: Checkstyle
        run: mvn -B -N checkstyle:check

      # PMD needs the reactor because the root project itself has packaging=pom.
      - name: PMD
        run: mvn -B pmd:aggregate-pmd-check

      # Reports are useful for debugging but must not make CI fail if the
      # artifact service is temporarily unavailable.
      - name: Upload analysis reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: analysis-reports
          retention-days: 7
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
          if-no-files-found: warn

  # ============================================================
  # BACKEND: COMPILE + UNIT TEST + PACKAGE
  # ============================================================

  backend:
    name: Backend · build and unit tests
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # "package" already performs:
      #
      #   compile
      #   test-compile
      #   test
      #   package
      #
      # so separate compile/test/package jobs would repeat the work.
      #
      # integration-tests is deliberately NOT included here because those tests
      # require the live Docker Compose stack started in the next job.
      - name: Compile, test and package backend
        run: >
          mvn -B
          -pl api-gateway,auth-service,patient-service,billing-service,analytics-service,infrastructure
          -am
          package

      - name: Upload unit-test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          retention-days: 7
          path: |
            api-gateway/target/surefire-reports/*.xml
            auth-service/target/surefire-reports/*.xml
            patient-service/target/surefire-reports/*.xml
            billing-service/target/surefire-reports/*.xml
            analytics-service/target/surefire-reports/*.xml
          if-no-files-found: warn

  # ============================================================
  # BACKEND: INTEGRATION
  # ============================================================

  integration:
    name: Backend · integration
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Start the stack
        run: docker compose up -d --build

      # Waiting for the gateway alone is not enough: its JWT filter can answer
      # before the downstream services are ready. Wait for every Spring Boot
      # application to report successful startup.
      - name: Wait for every microservice to start
        run: |
          pending="api-gateway auth-service patient-service billing-service analytics-service"
          deadline=$(( $(date +%s) + 240 ))

          while true; do
            remaining=""

            for svc in $pending; do
              if docker compose logs "$svc" 2>/dev/null \
                | grep -qE "Started [A-Za-z]+Application in"; then
                echo "started   $svc"
              else
                remaining="$remaining $svc"
              fi
            done

            pending=$(echo "$remaining" | xargs)

            [ -z "$pending" ] && break

            if [ "$(date +%s)" -ge "$deadline" ]; then
              for svc in $pending; do
                echo "::error::$svc never logged a successful startup"
              done

              docker compose ps -a
              docker compose logs --tail=100
              exit 1
            fi

            sleep 5
          done

          echo "all five services started"

      # A process can report "Started" and still terminate immediately afterward.
      - name: Verify every container is still running
        run: |
          fail=0

          for svc in \
            postgres \
            kafka \
            api-gateway \
            auth-service \
            patient-service \
            billing-service \
            analytics-service
          do
            state=$(
              docker compose ps -a --format '{{.Service}} {{.State}}' \
                | awk -v s="$svc" '$1 == s {print $2}'
            )

            if [ "$state" = "running" ]; then
              echo "running   $svc"
            else
              echo "::error::$svc is '$state', expected 'running'"
              fail=1
            fi
          done

          exit $fail

      - name: Verify unauthenticated gateway access is rejected
        run: |
          code=$(
            curl -s \
              -o /dev/null \
              -w '%{http_code}' \
              http://localhost:4004/api/patients
          )

          if [ "$code" != "401" ]; then
            echo "::error::expected 401 from the gateway, got $code"
            exit 1
          fi

          echo "gateway returned 401 without a token, as expected"

      # Creating a patient exercises:
      #
      #   gateway -> patient-service
      #           -> billing-service via gRPC
      #           -> analytics-service via Kafka
      #
      # Instead of sleeping for a fixed 10 seconds, poll until both downstream
      # services observe the patient or the timeout expires.
      - name: Verify create fan-out reaches billing and analytics
        run: |
          TOKEN=$(
            curl -s -X POST http://localhost:4004/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"testuser@test.com","password":"password123"}' \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p'
          )

          if [ -z "$TOKEN" ]; then
            echo "::error::login returned no token"
            exit 1
          fi

          ID=$(
            curl -s -X POST http://localhost:4004/api/patients \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"name":"CI Probe","email":"ci.probe@example.com","address":"1 CI Way","dateOfBirth":"1990-01-01","registeredDate":"2026-01-01"}' \
              | sed -n 's/.*"id":"\([^"]*\)".*/\1/p'
          )

          if [ -z "$ID" ]; then
            echo "::error::patient was not created"
            exit 1
          fi

          echo "created patient $ID"

          deadline=$(( $(date +%s) + 30 ))

          while true; do
            billing=false
            analytics=false

            if docker compose logs billing-service 2>/dev/null | grep -q "$ID"; then
              billing=true
            fi

            if docker compose logs analytics-service 2>/dev/null | grep -q "$ID"; then
              analytics=true
            fi

            if [ "$billing" = "true" ] && [ "$analytics" = "true" ]; then
              echo "billing and analytics both saw $ID"
              break
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              [ "$billing" = "true" ] \
                || echo "::error::billing-service never saw $ID over gRPC"

              [ "$analytics" = "true" ] \
                || echo "::error::analytics-service never consumed $ID from Kafka"

              exit 1
            fi

            sleep 2
          done

          curl -s \
            -X DELETE \
            "http://localhost:4004/api/patients/$ID" \
            -H "Authorization: Bearer $TOKEN" \
            -o /dev/null

      - name: Run integration tests
        run: mvn -B -pl integration-tests test

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest

    # configure-pages reads Pages metadata when this is a main deployment.
    permissions:
      contents: read
      pages: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install only once for both frontend variants.
      - name: Install dependencies
        run: npm ci

      # Normal application build, used when a backend/gateway exists.
      - name: Build normal console
        run: npm run build

      # Build again using the standalone Pages configuration.
      #
      # Vite replaces dist/, so after this step dist contains exactly the version
      # that should be deployed to GitHub Pages.
      - name: Build standalone Pages console
        env:
          VITE_DEMO_ONLY: 'true'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages setup/artifact upload is only required when this run may deploy.
      - name: Configure GitHub Pages
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  # ============================================================
  # GITHUB PAGES
  # ============================================================

  pages:
    name: Deploy · GitHub Pages
    needs: frontend

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    # Never interrupt an already-running deployment.
    # A later deployment waits for the current one.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4