name: CI

on:
  push:
    branches: [main, frontend]
  pull_request:
  workflow_dispatch:

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # -N keeps this on the aggregator: it already points at every module's
      # sources, so recursing would re-check them with the wrong basedir.
      - name: Run Checkstyle
        run: mvn -B -N checkstyle:check

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: warn

  backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Compiles the protobuf sources too, so this is what catches a broken .proto.
      - name: Package all modules
        run: mvn -B -DskipTests package

      - name: Upload service jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: '*/target/*-0.0.1-SNAPSHOT.jar'
          if-no-files-found: error

  frontend:
    name: Build console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Start the stack
        run: docker compose up -d --build

      # The gateway answers 401 on /api/patients without a token, which is proof
      # enough that it and the services behind it are accepting traffic.
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4004/api/patients || true)
            if [ "$code" = "401" ]; then echo "gateway up after ${i}s"; exit 0; fi
            sleep 5
          done
          echo "gateway did not come up"
          docker compose ps
          docker compose logs --tail=80
          exit 1

      - name: Run integration tests
        run: mvn -B -pl integration-tests test

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
