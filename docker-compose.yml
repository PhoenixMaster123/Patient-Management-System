# Full stack: Postgres, Kafka, and all five Spring Boot services.
#
#   docker compose up -d --build
#
# The gateway is the only service you call directly, on http://localhost:4004.
# The frontend console is not in here — it runs with `npm run dev` (see frontend/README.md).

name: pms

services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: patient-service-db
    ports:
      - "5432:5432"
    volumes:
      - pms-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d patient-service-db"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: pms-kafka
    ports:
      # Host clients use localhost:9092; containers use kafka:29092.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  billing-service:
    build: ./billing-service
    container_name: pms-billing-service
    ports:
      - "4001:4001"
      - "9001:9001"

  auth-service:
    build: ./auth-service
    container_name: pms-auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dev signing key. Override with JWT_SECRET in a .env file for anything real.
      JWT_SECRET: ${JWT_SECRET:-Y2hhVEc3aHJnb0hYTzMyZ2ZqVkpiZ1RkZG93YWxrUKM=}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth-service-db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
    ports:
      - "4005:4005"

  patient-service:
    build: ./patient-service
    container_name: pms-patient-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      billing-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patient-service-db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
    ports:
      - "4000:4000"

  analytics-service:
    build: ./analytics-service
    container_name: pms-analytics-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # The image exposes 4002, so pin the app to it.
      SERVER_PORT: 4002
    ports:
      - "4002:4002"

  api-gateway:
    build: ./api-gateway
    container_name: pms-api-gateway
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
    environment:
      # application.yml already routes to the compose hostnames; this one has no default.
      AUTH_SERVICE_URL: http://auth-service:4005
    ports:
      - "4004:4004"

volumes:
  pms-postgres-data:
